<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Custom Cards authoring structure</title>
  <desc id="desc">A Custom Cards container holds repeatable two-column Custom Card items.</desc>
  <rect width="720" height="280" fill="#fff"/>
  <rect x="20" y="20" width="680" height="240" rx="8" fill="#f5f5f5" stroke="#535862"/>
  <text x="40" y="52" fill="#181d27" font-family="sans-serif" font-size="18" font-weight="700">Custom Cards</text>
  <rect x="40" y="72" width="640" height="76" rx="6" fill="#fff" stroke="#d5d7da"/>
  <text x="56" y="98" fill="#181d27" font-family="sans-serif" font-size="14" font-weight="700">Custom Card Item</text>
  <text x="56" y="124" fill="#535862" font-family="sans-serif" font-size="13">Column 1: variation + images | Column 2: content + card link</text>
  <rect x="40" y="164" width="640" height="76" rx="6" fill="#fff" stroke="#d5d7da"/>
  <text x="56" y="190" fill="#181d27" font-family="sans-serif" font-size="14" font-weight="700">Reusable mobile Swiper</text>
  <text x="56" y="216" fill="#535862" font-family="sans-serif" font-size="13">Standard swiper-wrapper, swiper-slide, and swiper-pagination classes</text>
</svg>
